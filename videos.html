<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LSM Videos - Rehearsals and Performances</title>
<link rel="stylesheet" href="videos.css">
</head>
<body>
<div class="container">
<h1>LSM Videos - Rehearsals and Performances</h1>
<div class="video-container">
<video id="videoPlayer" controls>
<source src="Videos/Malawi National Anthem.mp4" type="video/mp4">
Your browser does not support the video tag.
</video>
<div class="no-content" id="noContent">No content available, come back later</div>
<div class="controls">
<button>Fullscreen</button>
<button>Minimize</button>
</div>
</div>
<p>Add your video files here. Replace the src with the path to your video.</p>
</div>
</div>

<!-- ═════ CONCERT HIGHLIGHTS ═════ -->
<section id="concert-highlights" class="section">
	<div class="container">
		<div class="section-header">
			<h2 class="section-title">Concert Highlights</h2>
			<p class="section-intro">Snapshots from recent concerts. Hover a photo to reveal the caption.</p>
		</div>
		<div class="highlights-window">
			<div class="highlights-grid">
				<figure class="highlight-item">
					<img src="Images/LSM Orchestra.jpg" alt="Orchestra on stage">
					<figcaption>LSM Orchestra opening night — March 2026</figcaption>
				</figure>
				<figure class="highlight-item">
					<img src="Images/LSM With Chaminade Orchestra.jpg" alt="Collaboration performance">
					<figcaption>Collaboration with Chaminade Orchestra</figcaption>
				</figure>
				<figure class="highlight-item">
					<img src="Images/LSM in performance.jpg" alt="Soloist performance">
					<figcaption>Student soloist performance</figcaption>
				</figure>
				<figure class="highlight-item">
					<img src="Images/LSM Ensemble.jpg" alt="Chamber ensemble">
					<figcaption>Chamber ensemble highlights</figcaption>
				</figure>
			</div>
		</div>
	</div>
</section>

<script src="videos.js"></script>
</body>
</html>
